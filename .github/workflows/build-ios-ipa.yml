# ─────────────────────────────────────────────────────────────────────────────
# 在 GitHub 的免费 macOS 机器上，把本项目打成一个【未签名】的 iOS .ipa
#
# 为什么要未签名：正式签名要 99 美元/年的苹果开发者账号。
#   未签名包下载到你 Windows 电脑后，用 iloader 配免费 Apple ID 现场签名安装。
#
# 怎么跑：推到 main / master 会自动触发；
#        也可以在网页上点 Actions → 选左边 "Build unsigned iOS IPA"
#        → 点右边 "Run workflow" 手动触发 → 在最下面 Artifacts 里下载 ipa
#
# 产物：FretroCam-unsigned.ipa（Release 版，JS 已内嵌，装上后完全离线可用）
# ─────────────────────────────────────────────────────────────────────────────

name: Build unsigned iOS IPA

on:
  # 允许在网页上点按钮手动触发
  workflow_dispatch:
  # 推到主分支时自动构建（main 和 master 都写上了，省得因为分支名不同白等一场）
  push:
    branches: [main, master]

# 同时只跑一个，避免排队浪费额度
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ipa:
    # 用 GitHub 免费提供的 macOS 机器。如果这行报「runner not found」，
    # 改成 macos-15 或 macos-14 即可（见 如何装到手机上.md 的排错一节）。
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: 1. 取出代码
        uses: actions/checkout@v5

      - name: 2. 装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 3. 打印构建环境（出问题时方便对照）
        run: |
          echo "macOS : $(sw_vers -productVersion)"
          echo "Xcode : $(xcodebuild -version | tr '\n' ' ')"
          echo "Node  : $(node -v)"
          echo "npm   : $(npm -v)"
          which pod && pod --version || echo "CocoaPods 尚未安装"
          echo "磁盘剩余："
          df -h /

      - name: 4. 装 JS 依赖
        # 本项目的 package-lock.json 是在国内装的，里面 500 条下载地址都指向
        # registry.npmmirror.com。GitHub 的机器在国外，先换成官方源（更快）。
        # 万一官方源的包校验值对不上，自动还原 lockfile 走国内镜像兜底。
        run: |
          set -e
          sed -i.bak 's|https://registry.npmmirror.com|https://registry.npmjs.org|g' package-lock.json
          rm -f package-lock.json.bak
          if npm ci --no-audit --no-fund; then
            echo "✅ 用官方源装好了"
          else
            echo "::warning::官方源安装失败，回退到国内镜像重试"
            rm -rf node_modules
            git checkout -- package-lock.json
            npm ci --no-audit --no-fund
            echo "✅ 用国内镜像装好了"
          fi
          echo "── node_modules 顶层条目数 ──"
          ls node_modules | wc -l

      - name: 5. 生成原生 iOS 工程（prebuild）
        # 这一步会读取 app.json，应用 expo-camera / expo-media-library 的配置，
        # 并生成 ios/ 目录（Windows 上没法做，只能在 macOS 上做）。
        run: npx expo prebuild --platform ios --no-install

      - name: 6. 装 CocoaPods 依赖
        # GitHub 的 macOS 机器自带 CocoaPods；万一哪天镜像里没有了，这里兜底装一次。
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            echo "机器上没有 CocoaPods，现场安装……"
            brew install cocoapods
          fi
          pod --version
          cd ios
          pod install

      - name: 7. 自动识别 scheme 名
        id: scheme
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          echo "workspace = $WORKSPACE"
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null \
            | awk '/Schemes:/{flag=1;next} /^$/{flag=0} flag' \
            | head -n 1 | tr -d '[:space:]')
          if [ -z "$SCHEME" ]; then SCHEME="FretroCam"; fi
          echo "scheme = $SCHEME"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME"       >> "$GITHUB_OUTPUT"

      - name: 7.5 问 Xcode：产物到底会放在哪
        id: prod
        # 先单独问一次，把答案存进 output 给第 8、9 步用
        # （-derivedDataPath 用绝对路径，省得相对路径被解析到别处去）
        run: |
          WS="${{ steps.scheme.outputs.workspace }}"
          SC="${{ steps.scheme.outputs.scheme }}"
          DD="$PWD/build"

          echo "workspace=$WS"
          echo "scheme=$SC"
          echo "derivedData=$DD"

          SETTINGS=$(xcodebuild -workspace "$WS" -scheme "$SC" \
                       -configuration Release -sdk iphoneos -showBuildSettings 2>&1 \
                     | grep -E "(BUILT_PRODUCTS_DIR|CONFIGURATION_BUILD_DIR|TARGET_BUILD_DIR|SYMROOT|OBJROOT|FULL_PRODUCT_NAME|WRAPPER_NAME) " \
                     || true)
          echo "── showBuildSettings ──"
          echo "$SETTINGS"

          # 一并写进「作业摘要」，网页上不登录也能看
          {
            echo "## 🔍 产物路径侦察"
            echo ""
            echo "\`workspace\` = \`$WS\` ｜ \`scheme\` = \`$SC\`"
            echo ""
            echo '```'
            echo "$SETTINGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "derivedData=$DD" >> "$GITHUB_OUTPUT"

      - name: 8. 编译（Release，不做签名）
        # CODE_SIGNING_ALLOWED=NO 是重点：没有苹果开发者证书也能编出 .app。
        # Release 配置会在 "Bundle React Native code and images" 阶段把 JS 打包进 App 内部，
        # 所以装到手机上之后完全离线可用，不需要电脑开着 Metro。
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.scheme.outputs.workspace }}" \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${{ steps.prod.outputs.derivedData }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: 9. 打成 .ipa
        # 不再猜路径：第 7.5 步已经问过 Xcode。这里先查它说的位置，
        # 再依次兜底（build 全目录 → DerivedData 默认位置 → 家目录），
        # 同时把整个现场写进「作业摘要」，失败也不会再「没有线索」。
        run: |
          set -e

          DD="${{ steps.prod.outputs.derivedData }}"

          {
            echo "## 📦 打包现场"
            echo ""
            echo "### 仓库根目录"
            echo '```'
            ls -la
            echo '```'
            echo "### build/ 目录树（前 40 行）"
            echo '```'
            ls -la build 2>&1 | head -20 || true
            find build -maxdepth 4 -type d 2>&1 | head -40 || true
            echo '```'
            echo "### 家目录里所有 .app（排除 Xcode 自带的）"
            echo '```'
            find "$HOME" -type d -name "*.app" -not -path "*/Xcode.app/*" 2>/dev/null | head -30 || true
            echo '```'
            echo "### 磁盘"
            echo '```'
            df -h /
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "── 开始找 .app ──"
          APP=""
          for DIR in "$DD/Build/Products/Release-iphoneos" "$DD" \
                     "$HOME/Library/Developer/Xcode/DerivedData"; do
            if [ -d "$DIR" ]; then
              echo "查 $DIR …"
              CAND=$(find "$DIR" -type d -name "*.app" 2>/dev/null | head -n 1 || true)
              if [ -n "$CAND" ]; then
                APP="$CAND"
                echo "✅ 在这里找到：$APP"
                break
              fi
            else
              echo "（$DIR 不存在）"
            fi
          done

          if [ -z "$APP" ]; then
            echo "::error::所有候选位置都没有 .app —— 请看本次运行的「作业摘要」里的目录树"
            exit 1
          fi

          echo "打包的 App：$APP"
          rm -rf Payload
          rm -f FretroCam-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry FretroCam-unsigned.ipa Payload
          ls -lh FretroCam-unsigned.ipa

      - name: 10. 上传 ipa（在页面最下方 Artifacts 里下载）
        uses: actions/upload-artifact@v4
        with:
          name: FretroCam-unsigned-ipa
          path: FretroCam-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
