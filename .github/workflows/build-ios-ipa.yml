# ─────────────────────────────────────────────────────────────────────────────
# 在 GitHub 的免费 macOS 机器上，把本项目打成一个【未签名】的 iOS .ipa
#
# 为什么要未签名：正式签名要 99 美元/年的苹果开发者账号。
#   未签名包下载到你 Windows 电脑后，用 iloader 配免费 Apple ID 现场签名安装。
#
# 怎么跑：推到 main / master 会自动触发；
#        也可以在网页上点 Actions → 选左边 "Build unsigned iOS IPA"
#        → 点右边 "Run workflow" 手动触发 → 在本次运行页面最下面 Artifacts 里下载 ipa
#
# ⚠️ 仓库已经转成私有，Actions 额度开始计费了：
#    GitHub Free 账号私有仓库每月 **2000 分钟**，而 macOS 机器按 **约 10 倍** 计费 ——
#    折成真实的 macOS 时间大约是每月 200 分钟；本项目一次构建实测 4~5 分钟，
#    也就是 **一个月大约能跑 40 次**。（作为参照：从 v1.0 到 v1.3.0 整个开发过程
#    一共跑了 21 次、合计约 70 分钟真实 macOS 时间，约合一个月份额的 1/3。）
#    所以下面 push 触发器加了 paths-ignore：只改文档不会构建。
#    真要省额度，可以在 Actions 页面把本 workflow 整个 Disable 掉，
#    需要时再手动 "Run workflow"。
#    另外还有一条 500 MB 的【工件存储】上限（不扣分钟数但会占满），
#    每个 ipa 约 9 MB —— 旧工件要定期删。
#    额度真不够用了，最彻底的一条路是把仓库改成 public：公开仓库的 Actions 完全不限量。
#
# 产物：FretroCam-unsigned.ipa（Release 版，JS 已内嵌，装上后完全离线可用）
# ─────────────────────────────────────────────────────────────────────────────

name: Build unsigned iOS IPA

on:
  # 允许在网页上点按钮手动触发
  workflow_dispatch:
  # 推到主分支时自动构建（main 和 master 都写上了，省得因为分支名不同白等一场）
  push:
    branches: [main, master]
    # 只改文档、许可证这类文件就别烧额度了。
    # 注意：改本文件自身（.yml）不在忽略范围内，仍会触发一次构建，
    #      纯文档/配置提交可以在 commit message 里写 [skip ci]。
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - '.gitignore'

# 同时只跑一个，避免排队浪费额度
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ipa:
    # 用 GitHub 免费提供的 macOS 机器。钉 Intel（x64）那一档，但**必须配 macOS 26**。
    #
    # 为什么要 Intel：`macos-latest` 现在指向 arm64 镜像，2026-10-15 这次构建连续三次
    #   排队满 15 分钟后被 GitHub 直接取消，`steps=0`（一步都没跑），两条标注是
    #     "The job was not acquired by Runner of type hosted even after multiple attempts"
    #     "Due to capacity constraints, jobs targeting macOS arm64 runners may experience longer queue times."
    #   —— 纯属 arm64 池排不上机器，与代码无关。Intel 池实测**秒分配**。
    #
    # 为什么是 26 而不是 15（这条是踩出来的）：换成 `macos-15-intel` 后机器立刻到手、
    #   前 7 步全过（npm ci / prebuild / pod install 都成功），第 8 步 `xcodebuild` 退出码 65：
    #     PhaseScriptExecution [CP-User] Build ExpoModulesJSI xcframework (in target 'ExpoModulesJSI')
    #   该脚本内部嵌套调用的 xcodebuild 报 `error: Could not resolve package dependencies:`。
    #   根因是那台镜像自带 **Xcode 16.4**（`/Applications/Xcode_16.4.app`），而 RN 0.86 /
    #   Expo SDK 57 的 `ExpoModulesJSI` xcframework 构建依赖 Xcode 26 那一代的 SPM 工具链。
    #   此前所有成功构建都跑在 `macos-latest` = macOS 26 + Xcode 26，所以本工作流**不 pin Xcode**，
    #   换镜像就等于换工具链 —— 镜像选错会以「包依赖解析不了」这种看不出真因的方式失败。
    #   → 取两者交集：`macos-26-intel`（macOS 26 x64，标准标签，免费）。
    #
    # 标签事实（`actions/runner-images` README）：macOS 26 x64 = `macos-26-intel` / `macos-26-large`；
    #   macOS 26 arm64 = `macos-latest` / `macos-26`；macOS 15 x64 = `macos-15-intel`。
    #   `-large` / `-xlarge` 才是计费的 larger runner，别改过去。
    # 宿主机是 Intel 还是 arm64 不影响产出的未签名 ipa（只做 prebuild + xcodebuild）。
    #
    # 回退路径：若这行报「runner not found」→ 改 `macos-26`（arm64，等池放量）；
    #   若又出现 SPM 依赖解析失败 → 说明镜像退回了旧 Xcode，改 `macos-26`。
    #   （见 如何装到手机上.md 的排错一节）
    runs-on: macos-26-intel
    timeout-minutes: 60

    steps:
      - name: 1. 取出代码
        uses: actions/checkout@v5

      - name: 2. 装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 3. 打印构建环境（出问题时方便对照）
        run: |
          echo "macOS : $(sw_vers -productVersion)"
          echo "Xcode : $(xcodebuild -version | tr '\n' ' ')"
          echo "Node  : $(node -v)"
          echo "npm   : $(npm -v)"
          which pod && pod --version || echo "CocoaPods 尚未安装"
          echo "磁盘剩余："
          df -h /

      - name: 4. 装 JS 依赖
        # 本项目的 package-lock.json 是在国内装的，里面 500 条下载地址都指向
        # registry.npmmirror.com。GitHub 的机器在国外，先换成官方源（更快）。
        # 万一官方源的包校验值对不上，自动还原 lockfile 走国内镜像兜底。
        run: |
          set -e
          sed -i.bak 's|https://registry.npmmirror.com|https://registry.npmjs.org|g' package-lock.json
          rm -f package-lock.json.bak
          if npm ci --no-audit --no-fund; then
            echo "✅ 用官方源装好了"
          else
            echo "::warning::官方源安装失败，回退到国内镜像重试"
            rm -rf node_modules
            git checkout -- package-lock.json
            npm ci --no-audit --no-fund
            echo "✅ 用国内镜像装好了"
          fi
          echo "── node_modules 顶层条目数 ──"
          ls node_modules | wc -l

      - name: 验证原生像素引擎与 JS 参考一致
        run: |
          npm run typecheck
          node scripts/check-v250-regressions.cjs
          node scripts/check-film-presets.cjs
          node scripts/check-film-overlay.cjs
          node scripts/check-date-size.cjs
          node scripts/check-import-gps.cjs
          npm run check:location
          node scripts/check-i18n.cjs
          node scripts/native-render-fixtures.cjs "$RUNNER_TEMP/film-fixtures.json"
          swiftc -O modules/film-renderer/ios/FilmPixelEngine.swift scripts/native-render-check/main.swift -o "$RUNNER_TEMP/film-render-check"
          "$RUNNER_TEMP/film-render-check" "$RUNNER_TEMP/film-fixtures.json"

      - name: 5. 生成原生 iOS 工程（prebuild）
        # 这一步会读取 app.json，应用 expo-camera / expo-media-library 的配置，
        # 并生成 ios/ 目录（Windows 上没法做，只能在 macOS 上做）。
        run: npx expo prebuild --platform ios --no-install

      - name: 6. 装 CocoaPods 依赖
        # GitHub 的 macOS 机器自带 CocoaPods；万一哪天镜像里没有了，这里兜底装一次。
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            echo "机器上没有 CocoaPods，现场安装……"
            brew install cocoapods
          fi
          pod --version
          cd ios
          pod install

      - name: 7. 自动识别 App 的 scheme 名
        # ⚠️ 这里踩过一个很大的坑，务必保留现在的写法：
        # CocoaPods 会往 workspace 里塞进几十个【Pod 自己的 scheme】
        # （EXConstants / Expo* / React* / RCT* / hermes-engine / Pods-FretroCam …），
        # 而且按字母排序时 EXConstants 排在真正的 App scheme 前面。
        # 如果偷懒「取第一个」，编的就是 EXConstants 那个静态库 ——
        # xcodebuild 会老老实实报 ** BUILD SUCCEEDED **，但【根本不产出任何 .app】，
        # 后面打包就会莫名其妙地找不到 App（表现为 ipa 只有几百字节或直接失败）。
        # 正确做法：App 的 scheme 名一定等于 <App名>.xcodeproj 的文件名，按它精确匹配。
        id: scheme
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          PROJ=$(basename "$(ls -d ios/*.xcodeproj | head -n 1)" .xcodeproj)
          echo "workspace = $WORKSPACE"
          echo "工程名    = $PROJ"
          echo "── workspace 里的全部 scheme ──"
          xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | sed -n '/Schemes:/,/^$/p'
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null \
            | sed -n '/Schemes:/,/^$/p' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -x "$PROJ" | head -n 1)
          if [ -z "$SCHEME" ]; then SCHEME="$PROJ"; fi
          echo "✅ 选中的 scheme = $SCHEME"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME"       >> "$GITHUB_OUTPUT"

      - name: 8. 编译（Release，不做签名）
        # CODE_SIGNING_ALLOWED=NO 是重点：没有苹果开发者证书也能编出 .app。
        # Release 配置会在 "Bundle React Native code and images" 阶段把 JS 打包进 App 内部，
        # 所以装到手机上之后完全离线可用，不需要电脑开着 Metro。
        # 全量日志留一份 xcodebuild.log 给失败时的诊断步用。
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.scheme.outputs.workspace }}" \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee xcodebuild.log | tail -n 120

      - name: 8.2 侦察：scheme 选对了吗、产物落在哪
        # 用 ::notice:: 而不是 ::error::，这样成功的运行也是绿的。
        # 说明：GitHub 的「作业摘要」和完整日志在【未登录】的网页上读不到，
        # 只有注解（Annotations）一定能看到，所以侦察结果全部走注解。
        if: always()
        run: |
          note() {
            local key="$1"
            local body
            body=$(head -c 2500 | awk '{printf "%s%%0A", $0}')
            echo "::notice::${key}%0A${body}"
          }
          echo "SCHEME=${{ steps.scheme.outputs.scheme }}" | note "选中的 scheme"
          echo "WORKSPACE=${{ steps.scheme.outputs.workspace }}" | note "选中的 workspace"
          xcodebuild -workspace "${{ steps.scheme.outputs.workspace }}" -list 2>&1 | head -n 30 | note "xcodebuild -list 全量"
          ls -la "$PWD/build/Build/Products/" 2>&1 | note "Products 目录"
          ls -la "$PWD/build/Build/Products/Release-iphoneos/" 2>&1 | head -n 45 | note "Release-iphoneos 里的东西"
          find "$PWD/build" -maxdepth 6 -name "*.app" 2>/dev/null | head -n 20 | note "build 里找到的 .app"

      - name: 9. 打成 .ipa
        # ⚠️ 这里有个踩过的坑：不能随便 find 一个 *.app 就用！
        # macOS 上有一堆名字以 .app 结尾的【普通文件夹】，例如
        #   ~/Library/Application Scripts/group.is.workflow.my.app
        #   ~/Library/Group Containers/group.is.workflow.my.app
        # 一旦被选中，就会打出一个只有几百字节的假 ipa（artifact 上传照样"成功"）。
        # 所以这里逐个用 plutil 验证它真的是 iPhoneOS 的 App，最后再核对文件大小。
        run: |
          set -e
          APP=""
          for base in "$GITHUB_WORKSPACE/build" "$HOME/Library/Developer/Xcode/DerivedData" "$GITHUB_WORKSPACE"; do
            [ -d "$base" ] || continue
            echo "── 在 $base 里找 ──"
            while IFS= read -r c; do
              [ -n "$c" ] || continue
              [ -f "$c/Info.plist" ] || continue
              plat=$(plutil -extract CFBundleSupportedPlatforms.0 raw "$c/Info.plist" 2>/dev/null || echo "?")
              echo "   候选：$c  （平台=$plat）"
              if [ "$plat" = "iPhoneOS" ]; then APP="$c"; break; fi
            done < <(find "$base" -type d -name "*.app" -not -path "*/Xcode.app/*" 2>/dev/null || true)
            if [ -n "$APP" ]; then break; fi
          done

          if [ -z "$APP" ]; then
            echo "::error::没找到任何 iPhoneOS 的 .app —— 请看下面「诊断」那一步的注解"
            exit 1
          fi

          echo "✅ 选中的 App：$APP"
          ls -la "$APP" | head -n 12
          du -sh "$APP"

          rm -rf Payload
          rm -f FretroCam-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry FretroCam-unsigned.ipa Payload

          SIZE=$(stat -f%z FretroCam-unsigned.ipa)
          echo "ipa 大小：$SIZE 字节"
          if [ "$SIZE" -lt 3000000 ]; then
            echo "::error::打出来的 ipa 只有 $SIZE 字节（正常应 20MB 以上）—— 说明选错了 .app"
            exit 1
          fi
          ls -lh FretroCam-unsigned.ipa
          echo "::notice::打包成功：FretroCam-unsigned.ipa（$SIZE 字节）"

      - name: 9.5 诊断（只有真的失败时才会执行）
        # 说明：GitHub 的「作业摘要」和完整日志在【未登录】的网页上读不到，
        # 只有 ::error:: 注解一定能看到。所以失败时把现场全部塞进注解。
        if: failure()
        run: |
          anno() {
            local key="$1"
            local body
            body=$(head -c 3500 | awk '{printf "%s%%0A", $0}')
            echo "::error::${key}%0A${body}"
          }
          echo "===== 1) xcodebuild 的结论 ====="
          grep -E "BUILD SUCCEEDED|BUILD FAILED|The following build commands failed|^error:| error: " xcodebuild.log 2>/dev/null | head -n 25 | anno "XCODE_结果"
          echo "===== 2) xcodebuild 日志最后 40 行 ====="
          tail -n 40 xcodebuild.log 2>/dev/null | anno "XCODE_日志尾部"
          echo "===== 3) 仓库根目录 ====="
          ls -la | anno "仓库根"
          echo "===== 4) build/ 目录树 ====="
          find build -maxdepth 5 2>/dev/null | head -n 50 | anno "build目录树"
          echo "===== 5) 家目录里所有 .app ====="
          find "$HOME" -type d -name "*.app" -not -path "*/Xcode.app/*" 2>/dev/null | head -n 20 | anno "家目录的app"
          echo "===== 6) 磁盘 ====="
          df -h / | anno "磁盘"

      - name: 10. 上传 ipa（在本次运行页面最下方 Artifacts 里下载）
        uses: actions/upload-artifact@v4
        with:
          name: FretroCam-unsigned-ipa
          path: FretroCam-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
