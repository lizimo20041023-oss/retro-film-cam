# ─────────────────────────────────────────────────────────────────────────────
# 在 GitHub 的免费 macOS 机器上，把本项目打成一个【未签名】的 iOS .ipa
#
# 为什么要未签名：正式签名要 99 美元/年的苹果开发者账号。
#   未签名包下载到你 Windows 电脑后，用 iloader 配免费 Apple ID 现场签名安装。
#
# 怎么跑：推到 main / master 会自动触发；
#        也可以在网页上点 Actions → 选左边 "Build unsigned iOS IPA"
#        → 点右边 "Run workflow" 手动触发 → 在本次运行页面最下面 Artifacts 里下载 ipa
#
# 产物：FretroCam-unsigned.ipa（Release 版，JS 已内嵌，装上后完全离线可用）
# ─────────────────────────────────────────────────────────────────────────────

name: Build unsigned iOS IPA

on:
  # 允许在网页上点按钮手动触发
  workflow_dispatch:
  # 推到主分支时自动构建（main 和 master 都写上了，省得因为分支名不同白等一场）
  push:
    branches: [main, master]

# 同时只跑一个，避免排队浪费额度
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ipa:
    # 用 GitHub 免费提供的 macOS 机器。如果这行报「runner not found」，
    # 改成 macos-15 或 macos-14 即可（见 如何装到手机上.md 的排错一节）。
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: 1. 取出代码
        uses: actions/checkout@v5

      - name: 2. 装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 3. 打印构建环境（出问题时方便对照）
        run: |
          echo "macOS : $(sw_vers -productVersion)"
          echo "Xcode : $(xcodebuild -version | tr '\n' ' ')"
          echo "Node  : $(node -v)"
          echo "npm   : $(npm -v)"
          which pod && pod --version || echo "CocoaPods 尚未安装"
          echo "磁盘剩余："
          df -h /

      - name: 4. 装 JS 依赖
        # 本项目的 package-lock.json 是在国内装的，里面 500 条下载地址都指向
        # registry.npmmirror.com。GitHub 的机器在国外，先换成官方源（更快）。
        # 万一官方源的包校验值对不上，自动还原 lockfile 走国内镜像兜底。
        run: |
          set -e
          sed -i.bak 's|https://registry.npmmirror.com|https://registry.npmjs.org|g' package-lock.json
          rm -f package-lock.json.bak
          if npm ci --no-audit --no-fund; then
            echo "✅ 用官方源装好了"
          else
            echo "::warning::官方源安装失败，回退到国内镜像重试"
            rm -rf node_modules
            git checkout -- package-lock.json
            npm ci --no-audit --no-fund
            echo "✅ 用国内镜像装好了"
          fi
          echo "── node_modules 顶层条目数 ──"
          ls node_modules | wc -l

      - name: 5. 生成原生 iOS 工程（prebuild）
        # 这一步会读取 app.json，应用 expo-camera / expo-media-library 的配置，
        # 并生成 ios/ 目录（Windows 上没法做，只能在 macOS 上做）。
        run: npx expo prebuild --platform ios --no-install

      - name: 6. 装 CocoaPods 依赖
        # GitHub 的 macOS 机器自带 CocoaPods；万一哪天镜像里没有了，这里兜底装一次。
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            echo "机器上没有 CocoaPods，现场安装……"
            brew install cocoapods
          fi
          pod --version
          cd ios
          pod install

      - name: 7. 自动识别 scheme 名
        id: scheme
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          echo "workspace = $WORKSPACE"
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null \
            | awk '/Schemes:/{flag=1;next} /^$/{flag=0} flag' \
            | head -n 1 | tr -d '[:space:]')
          if [ -z "$SCHEME" ]; then SCHEME="FretroCam"; fi
          echo "scheme = $SCHEME"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME"       >> "$GITHUB_OUTPUT"

      - name: 8. 编译（Release，不做签名）
        # CODE_SIGNING_ALLOWED=NO 是重点：没有苹果开发者证书也能编出 .app。
        # Release 配置会在 "Bundle React Native code and images" 阶段把 JS 打包进 App 内部，
        # 所以装到手机上之后完全离线可用，不需要电脑开着 Metro。
        # 全量日志留一份 xcodebuild.log 给失败时的诊断步用。
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.scheme.outputs.workspace }}" \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee xcodebuild.log | tail -n 120

      - name: 9. 打成 .ipa
        # ⚠️ 这里有个踩过的坑：不能随便 find 一个 *.app 就用！
        # macOS 上有一堆名字以 .app 结尾的【普通文件夹】，例如
        #   ~/Library/Application Scripts/group.is.workflow.my.app
        #   ~/Library/Group Containers/group.is.workflow.my.app
        # 一旦被选中，就会打出一个只有几百字节的假 ipa（artifact 上传照样"成功"）。
        # 所以这里逐个用 plutil 验证它真的是 iPhoneOS 的 App，最后再核对文件大小。
        run: |
          set -e
          APP=""
          for base in "$GITHUB_WORKSPACE/build" "$HOME/Library/Developer/Xcode/DerivedData" "$GITHUB_WORKSPACE"; do
            [ -d "$base" ] || continue
            echo "── 在 $base 里找 ──"
            while IFS= read -r c; do
              [ -n "$c" ] || continue
              [ -f "$c/Info.plist" ] || continue
              plat=$(plutil -extract CFBundleSupportedPlatforms.0 raw "$c/Info.plist" 2>/dev/null || echo "?")
              echo "   候选：$c  （平台=$plat）"
              if [ "$plat" = "iPhoneOS" ]; then APP="$c"; break; fi
            done < <(find "$base" -type d -name "*.app" -not -path "*/Xcode.app/*" 2>/dev/null || true)
            if [ -n "$APP" ]; then break; fi
          done

          if [ -z "$APP" ]; then
            echo "::error::没找到任何 iPhoneOS 的 .app —— 请看下面「诊断」那一步的注解"
            exit 1
          fi

          echo "✅ 选中的 App：$APP"
          ls -la "$APP" | head -n 12
          du -sh "$APP"

          rm -rf Payload
          rm -f FretroCam-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry FretroCam-unsigned.ipa Payload

          SIZE=$(stat -f%z FretroCam-unsigned.ipa)
          echo "ipa 大小：$SIZE 字节"
          if [ "$SIZE" -lt 3000000 ]; then
            echo "::error::打出来的 ipa 只有 $SIZE 字节（正常应 20MB 以上）—— 说明选错了 .app"
            exit 1
          fi
          ls -lh FretroCam-unsigned.ipa
          echo "::notice::打包成功：FretroCam-unsigned.ipa（$SIZE 字节）"

      - name: 9.5 诊断（只有真的失败时才会执行）
        # 说明：GitHub 的「作业摘要」和完整日志在【未登录】的网页上读不到，
        # 只有 ::error:: 注解一定能看到。所以失败时把现场全部塞进注解。
        if: failure()
        run: |
          anno() {
            local key="$1"
            local body
            body=$(head -c 3500 | awk '{printf "%s%%0A", $0}')
            echo "::error::${key}%0A${body}"
          }
          echo "===== 1) xcodebuild 的结论 ====="
          grep -E "BUILD SUCCEEDED|BUILD FAILED|The following build commands failed|^error:| error: " xcodebuild.log 2>/dev/null | head -n 25 | anno "XCODE_结果"
          echo "===== 2) xcodebuild 日志最后 40 行 ====="
          tail -n 40 xcodebuild.log 2>/dev/null | anno "XCODE_日志尾部"
          echo "===== 3) 仓库根目录 ====="
          ls -la | anno "仓库根"
          echo "===== 4) build/ 目录树 ====="
          find build -maxdepth 5 2>/dev/null | head -n 50 | anno "build目录树"
          echo "===== 5) 家目录里所有 .app ====="
          find "$HOME" -type d -name "*.app" -not -path "*/Xcode.app/*" 2>/dev/null | head -n 20 | anno "家目录的app"
          echo "===== 6) 磁盘 ====="
          df -h / | anno "磁盘"

      - name: 10. 上传 ipa（在本次运行页面最下方 Artifacts 里下载）
        uses: actions/upload-artifact@v4
        with:
          name: FretroCam-unsigned-ipa
          path: FretroCam-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
